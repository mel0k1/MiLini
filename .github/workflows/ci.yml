name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc cpio libelf-dev qemu-system-x86

      - name: fetch MiLin (pinned)
        run: scripts/fetch-milin.sh

      - name: build image
        run: scripts/build-image.sh

      - name: boot test
        run: scripts/run.sh

      - name: xbps repository
        run: scripts/mk-xbps.sh

      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milini-image
          path: |
            build/bzImage
            build/milini-initramfs.img
            build/boot.log
          if-no-files-found: ignore

      - name: artifacts (xbps repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milini-xbps-repo
          path: build/repo/
          if-no-files-found: ignore
